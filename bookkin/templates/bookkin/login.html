<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Bookkin</title>
  </head>
  <body>
    <main>
      <h1>Log in</h1>
      <form method="post" action="{% url 'bookkin:login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
      </form>
      <p>
        Need an account?
        <a href="{% url 'bookkin:signup' %}">Sign up</a>
      </p>
    </main>
  </body>
</html>
