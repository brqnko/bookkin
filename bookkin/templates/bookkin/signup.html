<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | Bookkin</title>
  </head>
  <body>
    <main>
      <h1>Create an account</h1>
      <form method="post" action="{% url 'bookkin:signup' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign up</button>
      </form>
      <p>
        Already have an account?
        <a href="{% url 'bookkin:login' %}">Log in</a>
      </p>
    </main>
  </body>
</html>
